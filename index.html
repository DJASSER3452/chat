<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Cyberpunk Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --primary-neon: #ff006e;
            --secondary-neon: #00f5ff;
            --dark-bg: #0a0e27;
            --darker-bg: #050812;
            --card-bg: #1a1f3a;
            --text-primary: #ff006e;
            --text-secondary: #00f5ff;
            --text-light: #e0e0e0;
            --border-color: #ff006e;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff0055;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--darker-bg);
            color: var(--text-light);
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 245, 255, 0.05) 0%, transparent 50%);
        }

        /* Neon Glow Effect */
        .neon-glow {
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon), 0 0 30px var(--primary-neon);
            color: var(--primary-neon);
        }

        .neon-glow-cyan {
            text-shadow: 0 0 10px var(--secondary-neon), 0 0 20px var(--secondary-neon), 0 0 30px var(--secondary-neon);
            color: var(--secondary-neon);
        }

        .neon-border {
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5), inset 0 0 20px rgba(255, 0, 110, 0.1);
        }

        .neon-border-cyan {
            border: 2px solid var(--secondary-neon);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5), inset 0 0 20px rgba(0, 245, 255, 0.1);
        }

        /* Corner Brackets */
        .corner-bracket {
            position: relative;
        }

        .corner-bracket::before,
        .corner-bracket::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--secondary-neon);
        }

        .corner-bracket::before {
            top: -10px;
            left: -10px;
            border-right: none;
            border-bottom: none;
        }

        .corner-bracket::after {
            bottom: -10px;
            right: -10px;
            border-left: none;
            border-top: none;
        }

        /* Main Container */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Auth Screen */
        .auth-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .auth-screen.active {
            display: flex;
        }

        .auth-form {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            neon-border-cyan;
            border: 2px solid var(--secondary-neon);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.1);
        }

        .auth-form h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px var(--primary-neon), 0 0 40px var(--primary-neon);
            color: var(--primary-neon);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary-neon);
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary-neon);
            color: var(--text-light);
            border-radius: 5px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-neon), #ff1493);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-neon), #00d9ff);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .toggle-form {
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
        }

        .toggle-form a {
            color: var(--secondary-neon);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--card-bg);
            border-right: 2px solid var(--primary-neon);
            display: flex;
            flex-direction: column;
            box-shadow: inset -20px 0 30px rgba(255, 0, 110, 0.1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--primary-neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-shadow: 0 0 10px var(--primary-neon);
            color: var(--primary-neon);
        }

        .sidebar-tabs {
            display: flex;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid var(--primary-neon);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            transition: all 0.3s ease;
            font-family: 'Space Mono', monospace;
        }

        .tab-btn.active {
            background: var(--secondary-neon);
            color: var(--darker-bg);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.6);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid transparent;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .conversation-item:hover {
            background: rgba(255, 0, 110, 0.1);
            border-left-color: var(--primary-neon);
        }

        .conversation-item.active {
            background: rgba(255, 0, 110, 0.15);
            border-left-color: var(--primary-neon);
            box-shadow: inset 0 0 15px rgba(255, 0, 110, 0.2);
        }

        .conversation-name {
            font-weight: bold;
            color: var(--text-light);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .conversation-preview {
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary-neon);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--primary-neon);
        }

        .online-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--success);
        }

        .offline-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            margin-right: 6px;
        }

        .search-box {
            padding: 10px;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--secondary-neon);
            color: var(--text-light);
            border-radius: 3px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark-bg);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 2px solid var(--primary-neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .chat-header-details h2 {
            font-size: 16px;
            color: var(--text-light);
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 4px;
        }

        .chat-header-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .chat-header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            width: 35px;
            height: 35px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 12px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 60%;
        }

        .message.own .message-content {
            max-width: 60%;
        }

        .message-bubble {
            background: rgba(255, 0, 110, 0.1);
            border: 1px solid var(--primary-neon);
            padding: 12px;
            border-radius: 5px;
            color: var(--text-light);
            word-wrap: break-word;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.2);
        }

        .message.own .message-bubble {
            background: rgba(0, 245, 255, 0.1);
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .message-meta {
            font-size: 10px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .read-receipt {
            color: var(--success);
        }

        .message-reactions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .reaction {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--secondary-neon);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reaction:hover {
            background: rgba(0, 245, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .media-preview {
            margin-top: 8px;
            max-width: 200px;
        }

        .media-preview img,
        .media-preview video {
            width: 100%;
            border-radius: 5px;
            border: 1px solid var(--secondary-neon);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--secondary-neon);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 2px solid var(--primary-neon);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            width: 35px;
            height: 35px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        .control-btn.recording {
            background: rgba(255, 0, 55, 0.3);
            border-color: var(--error);
            color: var(--error);
            box-shadow: 0 0 15px rgba(255, 0, 55, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .message-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary-neon);
            color: var(--text-light);
            border-radius: 5px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            resize: vertical;
            max-height: 100px;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-neon), #ff1493);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.8);
        }

        /* Emoji Picker */
        .emoji-picker-container {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--secondary-neon);
            border-radius: 5px;
            padding: 10px;
            display: none;
            z-index: 500;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            max-width: 300px;
        }

        .emoji-picker-container.active {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .emoji-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            font-size: 20px;
        }

        .emoji-item:hover {
            background: rgba(0, 245, 255, 0.2);
            transform: scale(1.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--secondary-neon);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.5);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--secondary-neon);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
        }

        /* User List */
        .user-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .user-item:hover {
            background: rgba(255, 0, 110, 0.1);
            border-left-color: var(--primary-neon);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .user-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .user-actions {
            display: flex;
            gap: 8px;
        }

        .user-action-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .user-action-btn:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .user-action-btn.accept {
            border-color: var(--success);
            color: var(--success);
        }

        .user-action-btn.accept:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .user-action-btn.reject {
            border-color: var(--error);
            color: var(--error);
        }

        .user-action-btn.reject:hover {
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--secondary-neon);
            padding: 15px 20px;
            border-radius: 5px;
            color: var(--text-light);
            z-index: 1001;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            max-width: 300px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.error {
            border-color: var(--error);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .notification.success {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 60px;
            opacity: 0.5;
        }

        .empty-state-text {
            text-align: center;
            font-size: 14px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {

                    <div class="form-group">
                        <label>Email</label>

                        <label>Password</label>
                        <input type="password" id="signUpPassword" placeholder="••••••••">

    </div>

    <!-- Main Container -->
    <div class="container" id="mainContainer" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">⚡ NEXUS</div>
                <button class="icon-btn" onclick="openUserProfile()" title="Profile">👤</button>
            </div>

            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchTab('chats')">Chats</button>
                <button class="tab-btn" onclick="switchTab('friends')">Friends</button>
                <button class="tab-btn" onclick="switchTab('requests')">Requests</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="handleSearch()">
            </div>

            <div class="sidebar-content" id="sidebarContent">

            <div style="padding: 10px; border-top: 1px solid var(--primary-neon);">

        <!-- Chat Area -->
        <div class="chat-container">

                    <div class="chat-header-details">
                        <h2 id="chatName">Select a conversation</h2>

                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>

            <div class="input-area" id="inputArea" style="display: none;">
                <div class="input-wrapper">
                    <div class="input-controls">
                        <button class="control-btn" onclick="toggleEmojiPicker()" title="Emoji">😊</button>
                        <button class="control-btn" onclick="triggerFileUpload()" title="Upload">📎</button>
                        <button class="control-btn" id="voiceBtn" onclick="toggleVoiceRecording()" title="Voice">🎤</button>
                    </div>
                    <textarea class="message-input" id="messageInput" placeholder="Type a message..." onkeypress="handleMessageKeypress(event)"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()" title="Send">➤</button>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">

    <!-- Modals -->
    <div class="modal" id="userProfileModal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeModal('userProfileModal')">✕</button>
            <div class="modal-header">My Profile</div>
            <div id="userProfileContent">
                <!-- Profile content will be populated -->
            </div>
        </div>
    </div>

    <div class="modal" id="groupInfoModal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeModal('groupInfoModal')">✕</button>
            <div class="modal-header">Group Info</div>
            <div id="groupInfoContent">
                <!-- Group info will be populated -->
            </div>
        </div>
    </div>

    <div class="modal" id="createGroupModal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeModal('createGroupModal')">✕</button>
            <div class="modal-header">Create Group Chat</div>
            <div class="form-group">
                <label>Group Name</label>
                <input type="text" id="groupNameInput" placeholder="Enter group name">
            </div>
            <div class="form-group">
                <label>Select Members</label>
                <div id="membersList" style="max-height: 300px; overflow-y: auto;">
                    <!-- Members will be populated -->
                </div>
            </div>
            <button class="btn" onclick="createGroup()">Create Group</button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js"></script>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAT0NJkXBVzMGk4Watp7PsCHfBq27HGl9E",
            authDomain: "djasser-chat-d39b3.firebaseapp.com",
            projectId: "djasser-chat-d39b3",
            storageBucket: "djasser-chat-d39b3.firebasestorage.app",
            messagingSenderId: "27428589819",
            appId: "1:27428589819:web:907b0c6d790b4cc3f1e05e",
            measurementId: "G-ZMPNELY0XP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        const messaging = firebase.messaging();

        // ============================================
        // GLOBAL STATE
        // ============================================
        let currentUser = null;
        let currentConversation = null;
        let conversations = [];
        let friends = [];
        let friendRequests = [];
        let currentTab = 'chats';
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        const emojis = ['😀', '😂', '😍', '🥰', '😎', '🤔', '😢', '😡', '🎉', '🎊', '🔥', '💯', '👍', '👎', '❤️', '💔', '💪', '🙌', '🤝', '✨', '🌟', '⭐', '🎯', '🚀', '💎', '🏆', '🎁', '🎈', '🎭', '🎪'];

        // ============================================
        // AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    // Create user profile
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName || 'User',
                        bio: '',
                        avatar: user.photoURL || getAvatarInitial(user.displayName || user.email),
                        createdAt: new Date(),
                        lastSeen: new Date(),
                        isOnline: true
                    });
                }
                showMainApp();
                initializeApp();
                updateUserStatus(true);
            } else {
                currentUser = null;
                showAuthScreen();
            }
        });

        function handleSignIn() {
            const email = document.getElementById('signInEmail').value;
            const password = document.getElementById('signInPassword').value;

            if (!email || !password) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    showNotification('Signed in successfully!', 'success');
                })
                .catch(error => {
                    showNotification(error.message, 'error');
                });
        }

        function handleSignUp() {
            const name = document.getElementById('signUpName').value;
            const email = document.getElementById('signUpEmail').value;
            const password = document.getElementById('signUpPassword').value;
            const bio = document.getElementById('signUpBio').value;

            if (!name || !email || !password) {
                showNotification('Please fill in all required fields', 'error');
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then(async (userCredential) => {
                    const user = userCredential.user;
                    await user.updateProfile({
                        displayName: name
                    });

                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: email,
                        name: name,
                        bio: bio,
                        avatar: getAvatarInitial(name),
                        createdAt: new Date(),
                        lastSeen: new Date(),
                        isOnline: true
                    });

                    showNotification('Account created successfully!', 'success');
                })
                .catch(error => {
                    showNotification(error.message, 'error');
                });
        }

        function handleLogout() {
            updateUserStatus(false);
            auth.signOut()
                .then(() => {
                    showNotification('Logged out successfully', 'success');
                })
                .catch(error => {
                    showNotification(error.message, 'error');
                });
        }

        function toggleAuthForm() {
            const signInForm = document.getElementById('signInForm');
            const signUpForm = document.getElementById('signUpForm');
            signInForm.style.display = signInForm.style.display === 'none' ? 'block' : 'none';
            signUpForm.style.display = signUpForm.style.display === 'none' ? 'block' : 'none';
        }

        // ============================================
        // UI MANAGEMENT
        // ============================================
        function showAuthScreen() {
            document.getElementById('authScreen').classList.add('active');
            document.getElementById('mainContainer').style.display = 'none';
        }

        function showMainApp() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('mainContainer').style.display = 'flex';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadSidebarContent();
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        async function initializeApp() {
            await loadConversations();
            await loadFriends();
            await loadFriendRequests();
            loadSidebarContent();
            setupEmojiPicker();
            setupNotifications();
        }

        // ============================================
        // CONVERSATIONS
        // ============================================
        async function loadConversations() {
            const query = db.collection('conversations')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('lastMessageTime', 'desc');

            query.onSnapshot(snapshot => {
                conversations = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                loadSidebarContent();
            });
        }

        async function openConversation(conversationId) {
            currentConversation = conversations.find(c => c.id === conversationId);
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';

            // Update header
            document.getElementById('chatName').textContent = currentConversation.name || 'Chat';
            document.getElementById('chatAvatar').textContent = getAvatarInitial(currentConversation.name || 'Chat');

            // Load messages
            loadMessages();

            // Mark as read
            await db.collection('conversations').doc(conversationId).update({
                [`unreadCount.${currentUser.uid}`]: 0
            });

            // Update sidebar
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.conversation-item')?.classList.add('active');
        }

        async function loadMessages() {
            const messagesRef = db.collection('conversations')
                .doc(currentConversation.id)
                .collection('messages')
                .orderBy('timestamp', 'asc');

            messagesRef.onSnapshot(snapshot => {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';

                snapshot.forEach(doc => {
                    const message = doc.data();
                    renderMessage(message, doc.id);
                });

                container.scrollTop = container.scrollHeight;
            });
        }

        function renderMessage(message, messageId) {
            const container = document.getElementById('messagesContainer');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${message.senderId === currentUser.uid ? 'own' : ''}`;

            let content = `
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="message-text">${escapeHtml(message.text)}</div>
            `;

            // Media
            if (message.mediaUrl) {
                if (message.mediaType.startsWith('image/')) {
                    content += `<div class="media-preview"><img src="${message.mediaUrl}" alt="Image"></div>`;
                } else if (message.mediaType.startsWith('video/')) {
                    content += `<div class="media-preview"><video controls><source src="${message.mediaUrl}"></video></div>`;
                } else if (message.mediaType.startsWith('audio/')) {
                    content += `<div class="media-preview"><audio controls><source src="${message.mediaUrl}"></audio></div>`;
                }
            }

            // Transcription
            if (message.transcription) {
                content += `<div style="margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 3px; font-size: 12px; color: var(--text-secondary);">📝 ${escapeHtml(message.transcription)}</div>`;
            }

            content += `
                        <div class="message-meta">
                            <span>${new Date(message.timestamp.toDate()).toLocaleTimeString()}</span>
                            ${message.isRead ? '<span class="read-receipt">✓✓</span>' : '<span>✓</span>'}
                        </div>
                    </div>
            `;

            // Reactions
            if (message.reactions && Object.keys(message.reactions).length > 0) {
                content += '<div class="message-reactions">';
                for (const [emoji, users] of Object.entries(message.reactions)) {
                    content += `<div class="reaction" onclick="addReaction('${messageId}', '${emoji}')">${emoji} ${users.length}</div>`;
                }
                content += '</div>';
            }

            content += '</div>';

            if (message.senderId !== currentUser.uid) {
                messageEl.innerHTML = `<div class="message-avatar">${getAvatarInitial(message.senderName)}</div>${content}`;
            } else {
                messageEl.innerHTML = content;
            }

            container.appendChild(messageEl);
        }

        async function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (!text && !currentConversation) return;

            const message = {
                senderId: currentUser.uid,
                senderName: currentUser.displayName || 'User',
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                isRead: false,
                reactions: {}
            };

            try {
                await db.collection('conversations')
                    .doc(currentConversation.id)
                    .collection('messages')
                    .add(message);

                await db.collection('conversations').doc(currentConversation.id).update({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('messageInput').value = '';

                // Send notification
                await sendNotificationToRecipients(currentConversation.id, `${currentUser.displayName}: ${text}`);
            } catch (error) {
                showNotification('Failed to send message', 'error');
            }
        }

        function handleMessageKeypress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // ============================================
        // FRIENDS MANAGEMENT
        // ============================================
        async function loadFriends() {
            const query = db.collection('users').doc(currentUser.uid).collection('friends');
            query.onSnapshot(snapshot => {
                friends = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                loadSidebarContent();
            });
        }

        async function loadFriendRequests() {
            const query = db.collection('users').doc(currentUser.uid).collection('friendRequests');
            query.onSnapshot(snapshot => {
                friendRequests = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                loadSidebarContent();
            });
        }

        async function sendFriendRequest(userId) {
            try {
                await db.collection('users').doc(userId).collection('friendRequests').add({
                    fromId: currentUser.uid,
                    fromName: currentUser.displayName,
                    fromEmail: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showNotification('Friend request sent!', 'success');
            } catch (error) {
                showNotification('Failed to send friend request', 'error');
            }
        }

        async function acceptFriendRequest(requestId, userId) {
            try {
                // Add to friends
                await db.collection('users').doc(currentUser.uid).collection('friends').doc(userId).set({
                    uid: userId,
                    addedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await db.collection('users').doc(userId).collection('friends').doc(currentUser.uid).set({
                    uid: currentUser.uid,
                    addedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Remove request
                await db.collection('users').doc(currentUser.uid).collection('friendRequests').doc(requestId).delete();

                showNotification('Friend request accepted!', 'success');
            } catch (error) {
                showNotification('Failed to accept friend request', 'error');
            }
        }

        async function declineFriendRequest(requestId) {
            try {
                await db.collection('users').doc(currentUser.uid).collection('friendRequests').doc(requestId).delete();
                showNotification('Friend request declined', 'success');
            } catch (error) {
                showNotification('Failed to decline friend request', 'error');
            }
        }

        // ============================================
        // SIDEBAR CONTENT
        // ============================================
        async function loadSidebarContent() {
            const container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            if (currentTab === 'chats') {
                if (conversations.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No conversations yet</div>';
                    return;
                }

                conversations.forEach(conv => {
                    const unreadCount = conv.unreadCount?.[currentUser.uid] || 0;
                    const el = document.createElement('div');
                    el.className = `conversation-item ${currentConversation?.id === conv.id ? 'active' : ''}`;
                    el.innerHTML = `
                        <div class="conversation-name">${conv.name || 'Chat'}</div>
                        <div class="conversation-preview">${conv.lastMessage || 'No messages yet'}</div>
                        ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                    `;
                    el.onclick = () => openConversation(conv.id);
                    container.appendChild(el);
                });
            } else if (currentTab === 'friends') {
                if (friends.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No friends yet</div>';
                    return;
                }

                friends.forEach(friend => {
                    const el = document.createElement('div');
                    el.className = 'user-item';
                    el.innerHTML = `
                        <div class="user-info">
                            <div class="user-name">${friend.name || 'User'}</div>
                            <div class="user-status">
                                <span class="${friend.isOnline ? 'online-indicator' : 'offline-indicator'}"></span>
                                ${friend.isOnline ? 'Online' : `Last seen: ${new Date(friend.lastSeen.toDate()).toLocaleString()}`}
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="user-action-btn" onclick="startDirectMessage('${friend.uid}', '${friend.name}')">Message</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
            } else if (currentTab === 'requests') {
                if (friendRequests.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No friend requests</div>';
                    return;
                }

                friendRequests.forEach(request => {
                    const el = document.createElement('div');
                    el.className = 'user-item';
                    el.innerHTML = `
                        <div class="user-info">
                            <div class="user-name">${request.fromName}</div>
                            <div class="user-status">${request.fromEmail}</div>
                        </div>
                        <div class="user-actions">
                            <button class="user-action-btn accept" onclick="acceptFriendRequest('${request.id}', '${request.fromId}')">Accept</button>
                            <button class="user-action-btn reject" onclick="declineFriendRequest('${request.id}')">Decline</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
            }
        }

        async function startDirectMessage(userId, userName) {
            try {
                // Check if conversation exists
                const existing = conversations.find(c => 
                    c.isGroup === false && 
                    c.participants.includes(userId) && 
                    c.participants.includes(currentUser.uid)
                );

                if (existing) {
                    openConversation(existing.id);
                    return;
                }

                // Create new conversation
                const convRef = await db.collection('conversations').add({
                    name: userName,
                    isGroup: false,
                    participants: [currentUser.uid, userId],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: '',
                    unreadCount: {}
                });

                const newConv = {
                    id: convRef.id,
                    name: userName,
                    isGroup: false,
                    participants: [currentUser.uid, userId]
                };

                currentConversation = newConv;
                document.getElementById('chatHeader').style.display = 'flex';
                document.getElementById('inputArea').style.display = 'flex';
                document.getElementById('chatName').textContent = userName;
                document.getElementById('messagesContainer').innerHTML = '';
                loadMessages();
            } catch (error) {
                showNotification('Failed to start conversation', 'error');
            }
        }

        // ============================================
        // EMOJI PICKER
        // ============================================
        function setupEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            emojis.forEach(emoji => {
                const el = document.createElement('div');
                el.className = 'emoji-item';
                el.textContent = emoji;
                el.onclick = () => {
                    document.getElementById('messageInput').value += emoji;
                    toggleEmojiPicker();
                };
                picker.appendChild(el);
            });
        }

        function toggleEmojiPicker() {
            document.getElementById('emojiPicker').classList.toggle('active');
        }

        async function addReaction(messageId, emoji) {
            try {
                const messageRef = db.collection('conversations')
                    .doc(currentConversation.id)
                    .collection('messages')
                    .doc(messageId);

                const messageDoc = await messageRef.get();
                const reactions = messageDoc.data().reactions || {};

                if (!reactions[emoji]) {
                    reactions[emoji] = [];
                }

                if (!reactions[emoji].includes(currentUser.uid)) {
                    reactions[emoji].push(currentUser.uid);
                }

                await messageRef.update({ reactions });
            } catch (error) {
                console.error('Failed to add reaction:', error);
            }
        }

        // ============================================
        // MEDIA & FILE HANDLING
        // ============================================
        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                showNotification('Uploading file...', 'success');
                const storageRef = storage.ref(`messages/${currentUser.uid}/${Date.now()}_${file.name}`);
                const uploadTask = storageRef.put(file);

                uploadTask.on('state_changed', (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    console.log('Upload progress:', progress);
                });

                await uploadTask;
                const mediaUrl = await storageRef.getDownloadURL();

                const message = {
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName || 'User',
                    text: `📎 ${file.name}`,
                    mediaUrl: mediaUrl,
                    mediaType: file.type,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isRead: false,
                    reactions: {}
                };

                await db.collection('conversations')
                    .doc(currentConversation.id)
                    .collection('messages')
                    .add(message);

                showNotification('File uploaded successfully!', 'success');
            } catch (error) {
                showNotification('Failed to upload file', 'error');
            }

            event.target.value = '';
        }

        // ============================================
        // VOICE MESSAGES
        // ============================================
        async function toggleVoiceRecording() {
            if (!isRecording) {
                startVoiceRecording();
            } else {
                stopVoiceRecording();
            }
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await uploadVoiceMessage(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                showNotification('Recording...', 'success');
            } catch (error) {
                showNotification('Failed to access microphone', 'error');
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('voiceBtn').classList.remove('recording');
            }
        }

        async function uploadVoiceMessage(audioBlob) {
            try {
                showNotification('Processing voice message...', 'success');
                const storageRef = storage.ref(`voice/${currentUser.uid}/${Date.now()}.webm`);
                await storageRef.put(audioBlob);
                const mediaUrl = await storageRef.getDownloadURL();

                // Transcribe audio (simulated - in production, use Web Speech API or server-side service)
                const transcription = await transcribeAudio(mediaUrl);

                const message = {
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName || 'User',
                    text: '🎤 Voice Message',
                    mediaUrl: mediaUrl,
                    mediaType: 'audio/webm',
                    transcription: transcription,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isRead: false,
                    reactions: {}
                };

                await db.collection('conversations')
                    .doc(currentConversation.id)
                    .collection('messages')
                    .add(message);

                showNotification('Voice message sent!', 'success');
            } catch (error) {
                showNotification('Failed to send voice message', 'error');
            }
        }

        async function transcribeAudio(audioUrl) {
            // Simulated transcription - in production, use Web Speech API or server service
            return '[Transcription: Voice message received]';
        }

        // ============================================
        // NOTIFICATIONS
        // ============================================
        function setupNotifications() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {
                    console.log('Service Worker registration failed');
                });
            }

            // Listen for new messages
            db.collection('conversations')
                .where('participants', 'array-contains', currentUser.uid)
                .onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'modified') {
                            const conv = change.doc.data();
                            if (conv.lastMessage && !conv.lastMessage.includes(currentUser.displayName)) {
                                playNotificationSound();
                            }
                        }
                    });
                });
        }

        async function sendNotificationToRecipients(conversationId, message) {
            const conv = conversations.find(c => c.id === conversationId);
            if (!conv) return;

            const recipients = conv.participants.filter(p => p !== currentUser.uid);
            recipients.forEach(recipientId => {
                // In production, send via Firebase Cloud Messaging
                console.log(`Notification sent to ${recipientId}: ${message}`);
            });
        }

        function playNotificationSound() {
            const audio = new Audio('data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==');
            audio.play().catch(() => {});
        }

        // ============================================
        // USER PROFILE
        // ============================================
        async function openUserProfile() {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            const userData = userDoc.data();

            const modal = document.getElementById('userProfileModal');
            const content = document.getElementById('userProfileContent');
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <div class="chat-header-avatar" style="width: 80px; height: 80px; font-size: 36px; margin: 0 auto 15px;">${userData.avatar}</div>
                    <h3 style="color: var(--text-light); margin-bottom: 5px;">${userData.name}</h3>
                    <p style="color: var(--text-secondary); font-size: 12px;">${userData.email}</p>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bioInput" style="resize: none;">${userData.bio || ''}</textarea>
                </div>
                <button class="btn" onclick="updateUserProfile()">Save Changes</button>
            `;
            openModal('userProfileModal');
        }

        async function updateUserProfile() {
            const bio = document.getElementById('bioInput').value;
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    bio: bio
                });
                showNotification('Profile updated!', 'success');
                closeModal('userProfileModal');
            } catch (error) {
                showNotification('Failed to update profile', 'error');
            }
        }

        // ============================================
        // GROUP CHATS
        // ============================================
        async function createGroup() {
            const groupName = document.getElementById('groupNameInput').value;
            const memberCheckboxes = document.querySelectorAll('#membersList input:checked');
            const selectedMembers = Array.from(memberCheckboxes).map(cb => cb.value);

            if (!groupName || selectedMembers.length === 0) {
                showNotification('Please enter group name and select members', 'error');
                return;
            }

            try {
                const convRef = await db.collection('conversations').add({
                    name: groupName,
                    isGroup: true,
                    participants: [currentUser.uid, ...selectedMembers],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: '',
                    unreadCount: {}
                });

                showNotification('Group created successfully!', 'success');
                closeModal('createGroupModal');
                document.getElementById('groupNameInput').value = '';
            } catch (error) {
                showNotification('Failed to create group', 'error');
            }
        }

        function toggleGroupInfo() {
            if (!currentConversation || !currentConversation.isGroup) return;
            const modal = document.getElementById('groupInfoModal');
            const content = document.getElementById('groupInfoContent');
            content.innerHTML = `
                <div class="form-group">
                    <label>Group Name</label>
                    <input type="text" value="${currentConversation.name}" readonly>
                </div>
                <div class="form-group">
                    <label>Members</label>
                    <div style="max-height: 200px; overflow-y: auto;">
                        ${currentConversation.participants.map(p => `<div style="padding: 8px; color: var(--text-light);">👤 ${p}</div>`).join('')}
                    </div>
                </div>
            `;
            openModal('groupInfoModal');
        }

        function toggleMediaGallery() {
            showNotification('Media gallery coming soon!', 'success');
        }

        // ============================================
        // SEARCH
        // ============================================
        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.conversation-item, .user-item');

            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        // ============================================
        // UTILITIES
        // ============================================
        function getAvatarInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        async function updateUserStatus(isOnline) {
            if (!currentUser) return;
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    isOnline: isOnline,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }

        // Update status when page closes
        window.addEventListener('beforeunload', () => {
            updateUserStatus(false);
        });

        // Update status periodically
        setInterval(() => {
            if (currentUser) {
                updateUserStatus(true);
            }
        }, 30000);
    </script>
</body>
