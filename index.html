<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ CLOSE - by Jasser Achalaf</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           CSS Variables & Themes (DZ CLOSE Style)
           ========================================= */
        :root {
            --primary: #0088cc; /* WhatsApp/Twitter like blue */
            --bg-main: #0b141a;
            --bg-secondary: #111b21;
            --bg-chat: #0b141a;
            --text-main: #e9edef;
            --text-secondary: #8696a0;
            --border-color: #222d34;
            --msg-sent: #005c4b;
            --msg-received: #202c33;
            --hover-bg: #202c33;
        }

        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-chat: #efeae2;
            --text-main: #111b21;
            --text-secondary: #667781;
            --border-color: #e9edef;
            --msg-sent: #d9fdd3;
            --msg-received: #ffffff;
            --hover-bg: #f5f6f6;
        }

        [data-theme="red"] {
            --primary: #e91e63;
            --msg-sent: #880e4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* =========================================
           Auth Screens
           ========================================= */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary), #0b141a);
        }
        .auth-box {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-box h1 { color: var(--primary); margin-bottom: 10px; font-size: 2.5em; }
        .auth-box p { color: var(--text-secondary); margin-bottom: 20px; }
        .auth-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: var(--bg-main); border: none; border-radius: 8px;
            color: var(--text-main); font-size: 16px; outline: none;
        }
        .btn {
            width: 100%; padding: 12px; margin: 10px 0;
            background: var(--primary); border: none; border-radius: 8px;
            color: white; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn:hover { opacity: 0.8; }
        .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; margin-top: 10px; }

        /* =========================================
           Main App Layout (Responsive)
           ========================================= */
        #app-container { display: none; height: 100vh; }
        .app-layout { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 400px; background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; position: relative;
        }
        .sidebar-header {
            padding: 15px; display: flex; justify-content: space-between;
            align-items: center; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .sidebar-nav { display: flex; justify-content: space-around; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .nav-item { color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 10px 20px; border-radius: 8px; }
        .nav-item.active { color: var(--primary); background: var(--hover-bg); }
        
        .search-bar { padding: 10px; }
        .search-bar input {
            width: 100%; padding: 10px 15px; background: var(--bg-main);
            border: none; border-radius: 20px; color: var(--text-main); outline: none;
        }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex; padding: 15px; cursor: pointer; border-bottom: 1px solid var(--border-color);
        }
        .chat-item:hover { background: var(--hover-bg); }
        .chat-item img { width: 50px; height: 50px; border-radius: 50%; margin-left: 15px; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: bold; display: flex; justify-content: space-between; }
        .chat-last-msg { color: var(--text-secondary); font-size: 14px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
        .online-dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Stories Bar */
        .stories-bar { display: flex; padding: 15px; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .story-item { margin-left: 15px; text-align: center; cursor: pointer; }
        .story-item img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--primary); padding: 2px; }
        .story-item span { font-size: 12px; display: block; margin-top: 5px; }

        /* Main Chat Area */
        .main-chat {
            flex: 1; display: flex; flex-direction: column;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-color: var(--bg-chat);
        }
        .chat-header {
            padding: 15px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header-info { display: flex; align-items: center; }
        .chat-header-info img { width: 40px; height: 40px; border-radius: 50%; margin-left: 15px; }
        .chat-header-icons i { margin: 0 10px; font-size: 20px; color: var(--text-secondary); cursor: pointer; }

        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .message {
            max-width: 65%; padding: 10px 15px; border-radius: 10px;
            margin-bottom: 10px; position: relative; font-size: 15px;
        }
        .message.sent { background: var(--msg-sent); align-self: flex-end; border-bottom-right-radius: 0; }
        .message.received { background: var(--msg-received); align-self: flex-start; border-bottom-left-radius: 0; }
        .message .time { font-size: 11px; color: var(--text-secondary); text-align: left; margin-top: 5px; display: block;}
        .voice-msg { display: flex; align-items: center; }
        .voice-msg i { margin-left: 10px; cursor: pointer; }
        .voice-wave { flex: 1; height: 20px; background: var(--primary); opacity: 0.5; border-radius: 10px; position: relative; overflow: hidden; }
        .voice-wave::after { content: ''; position: absolute; top:0; left:0; width: 40%; height: 100%; background: var(--primary); }

        .chat-input-area {
            padding: 15px; background: var(--bg-secondary);
            display: flex; align-items: center; border-top: 1px solid var(--border-color);
        }
        .chat-input-area input { flex: 1; padding: 12px 15px; background: var(--bg-main); border: none; border-radius: 20px; color: var(--text-main); outline: none; }
        .chat-input-area .input-actions i { margin: 0 10px; font-size: 24px; color: var(--text-secondary); cursor: pointer; }
        .recording-btn { color: #f44336 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Call UI */
        .call-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column;
            justify-content: center; align-items: center; color: white;
        }
        .call-overlay img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 20px; }
        .call-overlay h2 { margin-bottom: 10px; }
        .call-overlay p { color: #4caf50; margin-bottom: 40px; }
        .call-actions i { font-size: 30px; margin: 0 20px; padding: 15px; border-radius: 50%; cursor: pointer; }
        .call-end { background: #f44336; color: white; }

        /* Story Viewer */
        .story-viewer {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: black; z-index: 200; justify-content: center; align-items: center;
            flex-direction: column; color: white;
        }
        .story-viewer video, .story-viewer img { max-width: 100%; max-height: 80vh; }
        .story-progress { position: absolute; top: 20px; width: 90%; display: flex; }
        .progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); margin: 0 2px; }
        .progress-bar.active { background: white; }
        .story-header { position: absolute; top: 40px; width: 90%; display: flex; align-items: center; }
        .story-header img { width: 40px; height: 40px; border-radius: 50%; margin-left: 10px; }
        .story-close { position: absolute; top: 40px; left: 40px; font-size: 30px; cursor: pointer; }

        /* AI Assistant */
        .ai-window {
            display: none; position: fixed; bottom: 20px; left: 20px; width: 350px; height: 500px;
            background: var(--bg-secondary); border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            flex-direction: column; z-index: 50; overflow: hidden;
        }
        .ai-header { padding: 15px; background: var(--primary); color: white; display: flex; justify-content: space-between; }
        .ai-messages { flex: 1; padding: 15px; overflow-y: auto; }
        .ai-msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .ai-bot { background: var(--hover-bg); }
        .ai-user { background: var(--primary); color: white; margin-right: auto; margin-left: 0; text-align: left;}
        .ai-input { padding: 10px; border-top: 1px solid var(--border-color); display: flex; }
        .ai-input input { flex: 1; padding: 8px; background: var(--bg-main); border: none; color: var(--text-main); outline: none; border-radius: 15px;}

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; z-index: 10; }
            .main-chat { display: none; }
            .app-layout.chat-open .sidebar { display: none; }
            .app-layout.chat-open .main-chat { display: flex; }
            .ai-window { width: 90%; left: 5%; bottom: 10px; height: 60vh; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- ================= AUTH SCREENS ================= -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h1>DZ CLOSE</h1>
            <p>بواسطة المبرمج جاسر اشلاف</p>
            
            <div id="login-form">
                <input type="email" id="login-email" placeholder="البريد الإلكتروني">
                <input type="password" id="login-password" placeholder="كلمة السر">
                <button class="btn" onclick="login()">تسجيل الدخول</button>
                <button class="link-btn" onclick="showRegister()">إنشاء حساب جديد</button>
                <button class="link-btn" onclick="showResetPassword()">نسيت كلمة السر؟</button>
            </div>

            <div id="register-form" style="display:none;">
                <input type="text" id="reg-username" placeholder="اسم المستخدم">
                <input type="email" id="reg-email" placeholder="البريد الإلكتروني">
                <input type="password" id="reg-password" placeholder="كلمة السر">
                <button class="btn" onclick="register()">تسجيل</button>
                <button class="link-btn" onclick="showLogin()">لدي حساب بالفعل</button>
            </div>

            <div id="reset-form" style="display:none;">
                <input type="email" id="reset-email" placeholder="أدخل بريدك الإلكتروني لاستعادة كلمة السر">
                <button class="btn" onclick="resetPassword()">إرسال رابط الاستعادة</button>
                <button class="link-btn" onclick="showLogin()">العودة لتسجيل الدخول</button>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP ================= -->
    <div id="app-container">
        <div class="app-layout" id="app-layout">
            
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <img src="https://via.placeholder.com/40" class="user-avatar" id="my-avatar">
                    <div>
                        <i class="fas fa-robot" onclick="toggleAI()" style="margin-left: 15px; cursor:pointer;" title="المساعد الذكي"></i>
                        <i class="fas fa-palette" onclick="changeTheme()" style="margin-left: 15px; cursor:pointer;" title="تغيير الثيم"></i>
                        <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer;" title="تسجيل الخروج"></i>
                    </div>
                </div>
                
                <div class="sidebar-nav">
                    <div class="nav-item active" onclick="switchTab('chats')"><i class="fas fa-comment-dots"></i></div>
                    <div class="nav-item" onclick="switchTab('stories')"><i class="fas fa-circle-notch"></i></div>
                    <div class="nav-item" onclick="switchTab('friends')"><i class="fas fa-user-friends"></i></div>
                    <div class="nav-item" onclick="switchTab('groups')"><i class="fas fa-users"></i></div>
                </div>

                <div class="search-bar">
                    <input type="text" placeholder="بحث في DZ CLOSE..." id="search-input">
                </div>

                <div class="chat-list" id="chat-list">
                    <!-- Dynamic List -->
                </div>
            </div>

            <!-- Main Chat Section -->
            <div class="main-chat" id="main-chat">
                <div class="chat-header" id="chat-header" style="display:none;">
                    <div class="chat-header-info">
                        <i class="fas fa-arrow-right" onclick="closeChatMobile()" style="margin-left: 15px; display:none;" id="back-btn"></i>
                        <img src="https://via.placeholder.com/40" id="chat-avatar">
                        <div>
                            <h4 id="chat-name">المستخدم</h4>
                            <small id="chat-status">متصل</small>
                        </div>
                    </div>
                    <div class="chat-header-icons">
                        <i class="fas fa-video" onclick="startCall()"></i>
                        <i class="fas fa-phone" onclick="startCall()"></i>
                    </div>
                </div>
                
                <div class="messages-area" id="messages-area">
                    <div style="text-align:center; color:var(--text-secondary); margin-top:20vh;">
                        <h2>DZ CLOSE</h2>
                        <p>اختر دردشة للبدء أو استخدم المساعد الذكي</p>
                    </div>
                </div>

                <div class="chat-input-area" id="chat-input-area" style="display:none;">
                    <div class="input-actions">
                        <i class="fas fa-smile"></i>
                        <i class="fas fa-paperclip"></i>
                    </div>
                    <input type="text" placeholder="اكتب رسالة..." id="msg-input" onkeypress="handleEnter(event)">
                    <div class="input-actions">
                        <i class="fas fa-microphone" id="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()"></i>
                        <i class="fas fa-paper-plane" onclick="sendMessage()"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Call UI -->
        <div class="call-overlay" id="call-overlay">
            <img src="https://via.placeholder.com/100" id="call-avatar">
            <h2 id="call-name">المستخدم</h2>
            <p id="call-status">جاري الاتصال...</p>
            <div class="call-actions">
                <i class="fas fa-microphone-slash"></i>
                <i class="fas fa-volume-up"></i>
                <i class="fas fa-video"></i>
                <i class="fas fa-phone-slash call-end" onclick="endCall()"></i>
            </div>
        </div>

        <!-- Story Viewer -->
        <div class="story-viewer" id="story-viewer">
            <div class="story-progress" id="story-progress"></div>
            <div class="story-header">
                <img src="https://via.placeholder.com/40" id="story-user-avatar">
                <span id="story-user-name" style="margin-right:10px;">جاسر</span>
            </div>
            <i class="fas fa-times story-close" onclick="closeStory()"></i>
            <div id="story-content" onmousedown="pauseStory()" onmouseup="resumeStory()" ontouchstart="pauseStory()" ontouchend="resumeStory()">
                <!-- Image or Video -->
            </div>
        </div>

        <!-- AI Assistant -->
        <div class="ai-window" id="ai-window">
            <div class="ai-header">
                <h3><i class="fas fa-robot"></i> مساعد DZ CLOSE</h3>
                <i class="fas fa-times" onclick="toggleAI()" style="cursor:pointer;"></i>
            </div>
            <div class="ai-messages" id="ai-messages">
                <div class="ai-msg ai-bot">مرحباً! أنا مساعدك الذكي. كيف أستطيع مساعدتك؟ يمكنك سؤالي عن كيفية استخدام الستوريز، المكالمات، أو أي ميزة أخرى!</div>
            </div>
            <div class="ai-input">
                <input type="text" placeholder="اسألني..." id="ai-input" onkeypress="if(event.key==='Enter')sendAiMsg()">
            </div>
        </div>
    </div>

    <script>
        // =========================================
        // Firebase Configuration & Init
        // =========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQmWof8RhM8yef5MQDQ2Cc3KtMr7RQVHA",
            authDomain: "djasser-137e1.firebaseapp.com",
            databaseURL: "https://djasser-137e1-default-rtdb.firebaseio.com",
            projectId: "djasser-137e1",
            storageBucket: "djasser-137e1.firebasestorage.app",
            messagingSenderId: "204637393208",
            appId: "1:204637393208:web:236fea510daa1d0f66f1cd",
            measurementId: "G-HCDEQ72HYD"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        let currentUser = null;
        let currentChatId = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let storyTimer = null;
        let isStoryPaused = false;

        // =========================================
        // Authentication System
        // =========================================
        function showRegister() { document.getElementById('login-form').style.display='none'; document.getElementById('register-form').style.display='block'; document.getElementById('reset-form').style.display='none'; }
        function showLogin() { document.getElementById('login-form').style.display='block'; document.getElementById('register-form').style.display='none'; document.getElementById('reset-form').style.display='none'; }
        function showResetPassword() { document.getElementById('login-form').style.display='none'; document.getElementById('register-form').style.display='none'; document.getElementById('reset-form').style.display='block'; }

        function register() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const username = document.getElementById('reg-username').value;
            if(!email || !pass || !username) return alert('كل الحقول مطلوبة');
            auth.createUserWithEmailAndPassword(email, pass).then(cred => {
                return db.ref('users/' + cred.user.uid).set({
                    username: username,
                    email: email,
                    profilePictureUrl: 'https://via.placeholder.com/100',
                    bio: 'مستخدم جديد على DZ CLOSE',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    status: 'online',
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }).catch(e => alert(e.message));
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function resetPassword() {
            const email = document.getElementById('reset-email').value;
            auth.sendPasswordResetEmail(email).then(() => { alert('تم إرسال رابط استعادة كلمة السر'); showLogin(); }).catch(e => alert(e.message));
        }

        function logout() { auth.signOut(); }

        // Auth State Observer
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                initApp();
            } else {
                currentUser = null;
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        // =========================================
        // Online/Offline Status (onDisconnect)
        // =========================================
        function initApp() {
            const userStatusRef = db.ref('users/' + currentUser.uid);
            const isOfflineForDatabase = { status: 'offline', lastSeen: firebase.database.ServerValue.TIMESTAMP };
            const isOnlineForDatabase = { status: 'online', lastSeen: firebase.database.ServerValue.TIMESTAMP };

            db.ref('.info/connected').on('value', snapshot => {
                if (snapshot.val() === false) return;
                userStatusRef.onDisconnect().update(isOfflineForDatabase).then(() => {
                    userStatusRef.update(isOnlineForDatabase);
                });
            });

            db.ref('users/' + currentUser.uid).on('value', snap => {
                if(snap.val()) document.getElementById('my-avatar').src = snap.val().profilePictureUrl;
            });

            loadChats();
            loadStories();
        }

        // =========================================
        // Chat & Friends System (SQL Schema Adaptation)
        // =========================================
        function loadChats() {
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';
            
            // Simulated Chat List (In real app, query 'Follow' table to get friends)
            const usersRef = db.ref('users');
            usersRef.on('value', snapshot => {
                chatList.innerHTML = '';
                snapshot.forEach(child => {
                    if(child.key !== currentUser.uid) {
                        const user = child.val();
                        const chatItem = document.createElement('div');
                        chatItem.className = 'chat-item';
                        chatItem.onclick = () => openChat(child.key, user);
                        chatItem.innerHTML = `
                            <img src="${user.profilePictureUrl}">
                            <div class="chat-info">
                                <div class="chat-name">
                                    <span>${user.username} ${user.status === 'online' ? '<span class="online-dot"></span>' : ''}</span>
                                    <small style="color:var(--text-secondary)">12:00 م</small>
                                </div>
                                <div class="chat-last-msg">اضغط لبدء المحادثة</div>
                            </div>
                        `;
                        chatList.appendChild(chatItem);
                    }
                });
            });
        }

        function openChat(userId, userData) {
            currentChatId = userId;
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat-input-area').style.display = 'flex';
            document.getElementById('chat-avatar').src = userData.profilePictureUrl;
            document.getElementById('chat-name').innerText = userData.username;
            
            // Update status dynamically
            db.ref('users/' + userId).on('value', snap => {
                if(snap.val()) {
                    document.getElementById('chat-status').innerText = snap.val().status === 'online' ? 'متصل الآن' : 'آخر ظهور ' + new Date(snap.val().lastSeen).toLocaleTimeString('ar-EG');
                }
            });

            if(window.innerWidth < 768) {
                document.getElementById('app-layout').classList.add('chat-open');
                document.getElementById('back-btn').style.display = 'block';
            }

            loadMessages(userId);
            playNotificationSound('open');
        }

        function closeChatMobile() {
            document.getElementById('app-layout').classList.remove('chat-open');
        }

        function loadMessages(userId) {
            const chatId = [currentUser.uid, userId].sort().join('_');
            const msgArea = document.getElementById('messages-area');
            msgArea.innerHTML = '';
            
            db.ref('chats/' + chatId).on('value', snapshot => {
                msgArea.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const div = document.createElement('div');
                    div.className = `message ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
                    
                    if(msg.type === 'voice') {
                        div.innerHTML = `
                            <div class="voice-msg">
                                <i class="fas fa-play"></i>
                                <div class="voice-wave"></div>
                                <small class="time">${msg.duration || '0:00'}</small>
                            </div>`;
                    } else {
                        div.innerHTML = `${msg.text} <span class="time">${new Date(msg.timestamp).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}</span>`;
                    }
                    msgArea.appendChild(div);
                });
                msgArea.scrollTop = msgArea.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value;
            if(!text || !currentChatId) return;

            const chatId = [currentUser.uid, currentChatId].sort().join('_');
            db.ref('chats/' + chatId).push({
                senderId: currentUser.uid,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: 'text'
            });
            input.value = '';
            playNotificationSound('send');
        }

        function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

        // =========================================
        // Voice Recording (Messenger Style)
        // =========================================
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.add('recording-btn');
                
                mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                mediaRecorder.start();
            } catch(e) { alert('يجب السماح بالوصول إلى الميكروفون'); }
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('mic-btn').classList.remove('recording-btn');
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    // In a real app, upload to Firebase Storage, get URL, then send message.
                    // Here we simulate sending the voice note directly.
                    const chatId = [currentUser.uid, currentChatId].sort().join('_');
                    db.ref('chats/' + chatId).push({
                        senderId: currentUser.uid,
                        type: 'voice',
                        duration: '0:05', // Simulated
                        // audioUrl: downloadURL, 
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    playNotificationSound('send');
                };
            }
        }

        // =========================================
        // Calls (Realistic Simulation)
        // =========================================
        function startCall() {
            if(!currentChatId) return;
            const overlay = document.getElementById('call-overlay');
            overlay.style.display = 'flex';
            document.getElementById('call-status').innerText = 'جاري الاتصال...';
            
            // Simulate 15s wait
            setTimeout(() => { document.getElementById('call-status').innerText = 'مكالمة جارية 00:15'; }, 15000);
            
            // Auto end after 1 min for demo
            setTimeout(() => { endCall(); }, 60000);
        }

        function endCall() {
            document.getElementById('call-overlay').style.display = 'none';
        }

        // =========================================
        // Stories (Hold to pause, Video support)
        // =========================================
        let stories = [
            { userId: 'bot1', username: 'جاسر اشلاف', img: 'https://via.placeholder.com/100', type: 'image', url: 'https://picsum.photos/400/700' },
            { userId: 'bot2', username: 'مستخدم DZ', img: 'https://via.placeholder.com/100', type: 'image', url: 'https://picsum.photos/400/700?random=1' }
        ];
        let currentStory = 0;

        function loadStories() {
            const bar = document.querySelector('.stories-bar');
            // Add "Add Story" button
            bar.innerHTML = `<div class="story-item" onclick="alert('إضافة ستوري جديدة')"><img src="https://via.placeholder.com/60" style="border: 2px dashed var(--text-secondary);"><span>إضافة</span></div>`;
            
            stories.forEach((story, index) => {
                bar.innerHTML += `<div class="story-item" onclick="viewStory(${index})"><img src="${story.img}"><span>${story.username}</span></div>`;
            });
        }

        function viewStory(index) {
            currentStory = index;
            isStoryPaused = false;
            const viewer = document.getElementById('story-viewer');
            viewer.style.display = 'flex';
            
            const story = stories[index];
            document.getElementById('story-user-avatar').src = story.img;
            document.getElementById('story-user-name').innerText = story.username;
            
            const content = document.getElementById('story-content');
            if(story.type === 'image') {
                content.innerHTML = `<img src="${story.url}" style="height: 70vh; object-fit: contain;">`;
            } else {
                // Video Simulation
                content.innerHTML = `<video src="${story.url}" autoplay style="height: 70vh;"></video>`;
            }

            // Progress Bar
            const progress = document.getElementById('story-progress');
            progress.innerHTML = '';
            stories.forEach((_, i) => {
                const bar = document.createElement('div');
                bar.className = `progress-bar ${i <= index ? 'active' : ''}`;
                progress.appendChild(bar);
            });

            // Auto Next Story (5 seconds)
            clearInterval(storyTimer);
            let timeLeft = 5000;
            storyTimer = setInterval(() => {
                if(!isStoryPaused) {
                    timeLeft -= 100;
                    if(timeLeft <= 0) {
                        clearInterval(storyTimer);
                        if(index < stories.length - 1) viewStory(index + 1);
                        else closeStory();
                    }
                }
            }, 100);
        }

        function pauseStory() { isStoryPaused = true; }
        function resumeStory() { isStoryPaused = false; }
        function closeStory() { clearInterval(storyTimer); document.getElementById('story-viewer').style.display = 'none'; }

        // =========================================
        // Themes & Sounds
        // =========================================
        const themes = ['', 'light', 'red'];
        let themeIndex = 0;

        function changeTheme() {
            themeIndex++;
            if(themeIndex >= themes.length) themeIndex = 0;
            document.documentElement.setAttribute('data-theme', themes[themeIndex]);
            playNotificationSound('click');
        }

        function playNotificationSound(type) {
            // Base64 Encoded short beep sounds to avoid external files
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if(type === 'send') { oscillator.frequency.value = 800; gainNode.gain.value = 0.1; }
            else if(type === 'open') { oscillator.frequency.value = 600; gainNode.gain.value = 0.1; }
            else { oscillator.frequency.value = 500; gainNode.gain.value = 0.05; }
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // =========================================
        // AI Assistant (Teaches the App)
        // =========================================
        function toggleAI() { const w = document.getElementById('ai-window'); w.style.display = w.style.display === 'flex' ? 'none' : 'flex'; }

        function sendAiMsg() {
            const input = document.getElementById('ai-input');
            const text = input.value.toLowerCase();
            if(!text) return;
            
            addAiBubble(text, 'ai-user');
            input.value = '';

            let reply = "عذراً، لم أفهم سؤالك. حاول السؤال عن: الستوريز، المكالمات، تغيير الثيم، أو كيفية التسجيل.";
            
            if(text.includes('ستوري') || text.includes('قصص')) {
                reply = "لمشاهدة الستوري، اضغط على صورة صديقك في أعلى القائمة. يمكنك **الضغط مع الاستمرار (Hold)** لإيقاف الستوري مؤقتاً، ورفع إصبعك للاستمرار. إذا كانت الستوري فيديو، ستشتغل تلقائياً!";
            } else if(text.includes('مكالم') || text.includes('اتصال')) {
                reply = "لإجراء مكالمة، افتح دردشة الصديق واضغط على أيقونة الهاتف أو الفيديو في الأعلى. المكالمة ستبدأ بحالة 'جاري الاتصال...' لمدة 15 ثانية واقعية قبل أن تبدأ المكالمة الوهمية!";
            } else if(text.includes('ثيم') || text.includes('وضع') || text.includes('ليلي')) {
                reply = "لتغيير الثيم، اضغط على أيقونة **اللوحة (🎨)** في أعلى القائمة الجانبية. التطبيق يدعم الوضع الليلي، الفاتح، والوردي!";
            } else if(text.includes('صوت') || text.includes('رسالة صوتية')) {
                reply = "لتسجيل رسالة صوتية مثل الماسنجر، اضغط مع الاستمرار على أيقونة **الميكروفون (🎤)**. أثناء التسجيل، سيتحول اللون لأحمر. ارفع إصبعك لإرسالها فوراً!";
            } else if(text.includes('من صنع') || text.includes('مبرمج')) {
                reply = "تم صنع هذا التطبيق بالكامل بواسطة المبرمج الجزائري الشاب **جاسر اشلاف**! 🇩🇿";
            }

            setTimeout(() => addAiBubble(reply, 'ai-bot'), 1000);
        }

        function addAiBubble(text, cls) {
            const div = document.createElement('div');
            div.className = `ai-msg ${cls}`;
            div.innerText = text;
            document.getElementById('ai-messages').appendChild(div);
            document.getElementById('ai-messages').scrollTop = 99999;
        }

        // Tab switching logic (Simulated)
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
            // In a full app, this would filter the chat-list based on Friends/Groups schema.
            if(tab === 'groups') alert('ميزة الغروبات قيد التطوير باستخدام الـ Schema الخاص بك!');
        }

    </script>
